<div class="scope-tabs" role="tablist" aria-label="Show notes for" data-event="keydown:_onKeydown:@event">
  ${tabs.map((tab) => html`
  <button
    class="scope-tabs__tab"
    type="button"
    role="tab"
    id="scope-tab-${tab.scope}"
    aria-controls="${panelId}"
    aria-selected="${tab.selected ? 'true' : 'false'}"
    tabindex="${tab.selected ? '0' : '-1'}"
    data-scope="${tab.scope}"
    data-event="click:_select:@dataset:scope">
    <span class="scope-tabs__label">${tab.label}</span>
    <span class="scope-tabs__count">${tab.count}<a11y-visually-hidden>${tab.count === 1 ? ' note' : ' notes'}</a11y-visually-hidden></span>
  </button>`)}
</div>
