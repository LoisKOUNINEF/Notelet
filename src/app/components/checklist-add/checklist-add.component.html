<form class="checklist-add" data-event="submit:_add">
  <a11y-input class="checklist-add__field">
    <a11y-label><span class="a11y-visually-hidden">Add an item to ${name}</span></a11y-label>
    <input class="checklist-add__input" type="text" autocomplete="off" placeholder="Add an item…">
  </a11y-input>
  <button class="button button--small checklist-add__submit" type="submit" tabindex="0">Add<span class="a11y-visually-hidden">${' item'}</span></button>
</form>
