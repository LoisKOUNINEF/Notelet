<form class="note-composer" data-event="submit:_add">
  <a11y-textarea class="note-composer__field">
    <a11y-label>${label}</a11y-label>
    <textarea class="note-composer__input" name="text" rows="3" ${hasItems ? '' : raw('required')} placeholder="Write a note…" data-event="keydown:_onKeydown:@event">${draft}</textarea>
  </a11y-textarea>
  <div data-component="checklist-fields"></div>
  <div class="note-composer__actions">
    <button class="button button--small note-composer__checklist" type="button" tabindex="0" data-event="click:_addChecklistItem">${buttonLabel(hasItems)}</button>
    <span class="note-composer__hint" aria-hidden="true">Ctrl+Enter to add</span>
    <button class="button button--primary" type="submit" tabindex="0">Add note</button>
  </div>
</form>
