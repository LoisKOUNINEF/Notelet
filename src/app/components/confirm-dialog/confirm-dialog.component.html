<div class="confirm-dialog__overlays">
  <a11y-modal id="confirm-dialog" class="confirm-dialog">
    <h2 class="confirm-dialog__title">${title}</h2>
    <p class="confirm-dialog__message">${message}</p>
    <div class="confirm-dialog__buttons">
      <button class="button confirm-dialog__cancel" type="button" tabindex="0" data-action="cancel">Cancel</button>
      <button class="button button--danger confirm-dialog__confirm" type="button" tabindex="0" data-action="confirm">${confirmLabel}</button>
    </div>
  </a11y-modal>
</div>
