<div class="todo-list">
  ${open.length > 0 ? html`<ul class="todo-list__items" data-catalog="open-todos" aria-label="${label}"></ul>` : ''}
  <div data-component="todo-composer"></div>
  ${done.length > 0 ? html`
  <div class="todo-list__done">
    <div class="todo-list__done-header">
      <button class="todo-list__done-toggle" type="button" tabindex="0" aria-expanded="${expanded ? 'true' : 'false'}" aria-controls="todo-done-items" data-event="click:_toggleDone">
        <span class="todo-list__chevron" aria-hidden="true"></span>Done (${done.length})
      </button>
      <button class="button button--small todo-list__clear" type="button" tabindex="0" data-event="click:_clearDone">Clear completed</button>
    </div>
    <ul class="todo-list__items" id="todo-done-items" data-catalog="done-todos" aria-label="Done ${label.toLowerCase()}" ${expanded ? '' : raw('hidden')}></ul>
  </div>` : ''}
</div>
