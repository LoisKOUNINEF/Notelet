<div class="todo-list">
  ${open.length > 0 ? html`<ul class="todo-list__items todo-list__open" data-catalog="open-todos" aria-label="${label}"></ul>` : ''}
  ${open.length > 1 ? html`<p class="a11y-visually-hidden" id="todo-reorder-help">Press Space to pick up. Use the arrow keys to move, Space to drop, Escape to cancel.</p>` : ''}
  <div data-component="todo-composer"></div>
  ${done.length > 0 ? html`
  <div class="todo-list__done">
    <button class="todo-list__done-toggle" type="button" tabindex="0" aria-expanded="${expanded ? 'true' : 'false'}" aria-controls="todo-done-items" data-event="click:_toggleDone">
      <span class="todo-list__chevron" aria-hidden="true"></span>Done (${done.length})
    </button>
    <ul class="todo-list__items" id="todo-done-items" data-catalog="done-todos" aria-label="Done ${label.toLowerCase()}" ${expanded ? '' : raw('hidden')}></ul>
    <button class="button button--small todo-list__delete-done" type="button" tabindex="0" data-event="click:_deleteDone">Delete all done</button>
  </div>` : ''}
  ${open.length + done.length > 0 ? html`
  <div class="todo-list__footer">
    <button class="button button--small button--danger todo-list__delete-all" type="button" tabindex="0" data-event="click:_deleteAll">Delete all to-dos</button>
  </div>` : ''}
</div>
