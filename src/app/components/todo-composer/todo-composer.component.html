<form class="todo-composer" data-event="submit:_add">
  <div class="todo-composer__row">
    <a11y-input class="todo-composer__field">
      <a11y-label>${checklistMode ? `New checklist for this ${scope}` : `New to-do for this ${scope}`}</a11y-label>
      <input class="todo-composer__input" type="text" name="text" required autocomplete="off" placeholder="${checklistMode ? 'Checklist name…' : 'Write a to-do…'}" value="${draft}">
    </a11y-input>
  </div>
  <div data-component="checklist-fields"></div>
  <div class="todo-composer__actions">
    <button class="button button--small todo-composer__checklist" type="button" tabindex="0" data-event="click:_addChecklistItem">${checklistMode ? 'Add item' : 'Checklist'}</button>
    <span class="todo-composer__hint" aria-hidden="true">${checklistMode ? 'Ctrl+Enter to add' : 'Enter to add'}</span>
    <button class="button button--primary todo-composer__submit" type="submit" tabindex="0">Add<span class="a11y-visually-hidden">${checklistMode ? ' checklist' : ' to-do'}</span></button>
  </div>
</form>
