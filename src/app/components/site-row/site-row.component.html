${current ? html`
<div class="site-row__info">
  <span class="site-row__name" id="site-row-${site.site}-name">${site.site}<span class="site-row__current">${' (current)'}</span></span>
  <span class="site-row__meta">${counts} · Edited <time datetime="${new Date(site.lastEdited).toISOString()}" title="${formatDateTime(site.lastEdited)}" data-pipe="timeAgo">${site.lastEdited}</time></span>
</div>` : html`
<button class="site-row__info site-row__open" type="button" tabindex="0" title="${url}" data-event="click:_open">
  <span class="site-row__name" id="site-row-${site.site}-name">${site.site}</span>
  <span class="site-row__meta">${counts} · Edited <time datetime="${new Date(site.lastEdited).toISOString()}" title="${formatDateTime(site.lastEdited)}" data-pipe="timeAgo">${site.lastEdited}</time></span>
</button>`}
<span class="site-row__actions">
  <span data-component="item-menu"></span>
  <button class="button button--small button--danger site-row__delete" type="button" tabindex="0" aria-describedby="site-row-${site.site}-name" data-event="click:_delete">Delete all</button>
</span>
