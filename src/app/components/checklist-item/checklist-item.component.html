<a11y-checkbox class="checklist-item__check">
  <input class="checklist-item__checkbox" type="checkbox" tabindex="0" aria-labelledby="item-${item.id}-text" ${item.done ? raw('checked') : ''} data-event="change:_toggle:@checked">

<span class="checklist-item__text" id="item-${item.id}-text">${item.text}</span>
