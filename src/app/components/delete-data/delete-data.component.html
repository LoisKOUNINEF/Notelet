<div class="delete-data">
  <div class="delete-data__group">
    <div class="delete-data__row">
      <a11y-select class="delete-data__age" label="Delete all older than">
        <select class="delete-data__select" name="age" tabindex="0" ${busy ? raw('disabled') : ''} data-event="change:_setAge:@target">
          ${ages.map((age) => html`<option value="${age.value}" ${age.selected ? raw('selected') : ''}>${age.label}</option>`)}
        </select>
      </a11y-select>
      <button class="button button--danger delete-data__older-button" id="delete-data-older-button" type="button" tabindex="0" ${olderNothing ? raw('aria-disabled="true"') : ''} ${olderDisabled ? raw('disabled') : ''} data-event="click:_deleteOlder">Delete<span class="a11y-visually-hidden">${' older notes and to-dos'}</span></button>
    </div>
  </div>
  <div class="delete-data__group" role="group" aria-labelledby="delete-data-all-label">
    <p class="delete-data__label" id="delete-data-all-label">Delete all</p>
    <button class="button button--danger delete-data__all-button" id="delete-data-all-button" type="button" tabindex="0" ${allNothing ? raw('aria-disabled="true"') : ''} ${allDisabled ? raw('disabled') : ''} data-event="click:_deleteEverything">Delete all notes and to-dos</button>
  </div>
  <div class="delete-data__overlays">
    ${olderNothing || olderText ? html`<a11y-tooltip anchor="delete-data-older-button" placement="top">${olderNothing ?? olderText}</a11y-tooltip>` : ''}
    ${allNothing || allText ? html`<a11y-tooltip anchor="delete-data-all-button" placement="top">${allNothing ?? allText}</a11y-tooltip>` : ''}
  </div>
</div>
