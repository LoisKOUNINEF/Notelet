<div class="delete-data">
  <div class="delete-data__group">
    <div class="delete-data__row">
      <a11y-select class="delete-data__age" label="Delete all older than">
        <select class="delete-data__select" name="age" tabindex="0" ${busy ? raw('disabled') : ''} data-event="change:_setAge:@target">
          ${ages.map((age) => html`<option value="${age.value}" ${age.selected ? raw('selected') : ''}>${age.label}</option>`)}
        </select>
      </a11y-select>
      <button class="button button--danger delete-data__older-button" type="button" tabindex="0" aria-describedby="delete-data-older-text" ${olderDisabled ? raw('disabled') : ''} data-event="click:_deleteOlder">Delete<span class="a11y-visually-hidden">${' older notes and to-dos'}</span></button>
    </div>
    <p class="delete-data__text" id="delete-data-older-text">${olderText}</p>
  </div>
  <div class="delete-data__group">
    <button class="button button--danger delete-data__all-button" type="button" tabindex="0" aria-describedby="delete-data-all-text" ${allDisabled ? raw('disabled') : ''} data-event="click:_deleteEverything">Delete all notes and to-dos</button>
    <p class="delete-data__text" id="delete-data-all-text">${allText}</p>
  </div>
</div>
