<form class="todo-editor__form" data-event="submit:_save">
  ${restored ? html`<p class="todo-editor__restored">Unsaved changes restored.</p>` : ''}
  <a11y-textarea class="todo-editor__field line-field">
    <a11y-label>${hasItems ? 'Checklist name' : 'To-do'}</a11y-label>
    <textarea class="todo-editor__input" name="text" rows="1" required autocomplete="off">${text}</textarea>
  </a11y-textarea>
  <div data-component="checklist-fields"></div>
  ${takenOut.length > 0 ? html`
  <div class="todo-editor__taken-out">
    <p class="todo-editor__taken-out-title" id="todo-editor-taken-out-title">Will be separate to-dos once saved:</p>
    <ul class="todo-editor__taken-out-list" aria-labelledby="todo-editor-taken-out-title">
      ${takenOut.map((item) => html`
      <li class="todo-editor__taken-out-item">
        <span class="todo-editor__taken-out-text">${item.text}</span>
        <button class="button button--small todo-editor__put-back" type="button" tabindex="0" aria-label="Put back ${item.text}" data-id="${item.id}" data-event="click:_putBack:@dataset:id">Put back</button>
      </li>`)}
    </ul>
  </div>` : ''}
  <div class="todo-editor__actions">
    <button class="button button--small todo-editor__add-item" type="button" tabindex="0" data-event="click:_addField">Add item</button>
    <span class="todo-editor__spacer"></span>
    <button class="button button--small button--primary" type="submit" tabindex="0">Save</button>
    <button class="button button--small todo-editor__cancel" type="button" tabindex="0" data-event="click:_cancel">Cancel</button>
  </div>
  <span class="todo-editor__hint" aria-hidden="true">${hasItems ? submitShortcut() : 'Enter'} to save · Esc to cancel</span>
</form>
