${editing ? html`<div data-component="note-editor"></div>` : html`
<p class="note-item__text" id="note-${note.id}-text">${note.text}</p>
<div class="note-item__footer">
  ${reorderable ? html`
  <button class="note-item__handle" type="button" tabindex="0" aria-label="Reorder: ${name}" aria-describedby="note-reorder-help" aria-pressed="${grabbed ? 'true' : 'false'}">
    <span class="note-item__grip" aria-hidden="true"></span>
  </button>` : ''}
  <span class="note-item__meta">${edited ? 'Edited ' : ''}<time datetime="${new Date(note.updatedAt).toISOString()}" title="${new Date(note.updatedAt).toLocaleString()}" data-pipe="timeAgo">${note.updatedAt}</time></span>
  <div class="note-item__actions">
    <button class="button button--small note-item__edit" type="button" tabindex="0" aria-describedby="note-${note.id}-text" data-event="click:_edit">Edit</button>
    <button class="button button--small button--danger note-item__delete" type="button" tabindex="0" aria-describedby="note-${note.id}-text" data-event="click:_delete">Delete</button>
    <button class="button button--small note-item__more" id="note-${note.id}-more" type="button" tabindex="0" aria-label="More actions for: ${name}">⋯</button>
  </div>
</div>
<div class="note-item__overlays">
  <a11y-dropdown id="note-${note.id}-menu" anchor="note-${note.id}-more" placement="bottom-end">
    <div role="menuitem" tabindex="-1" data-action="move">Move to ${moveTarget}</div>
  </a11y-dropdown>
</div>`}
