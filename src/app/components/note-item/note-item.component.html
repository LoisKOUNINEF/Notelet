${editing ? html`
<form class="note-item__form" data-event="submit:_save">
  <a11y-textarea class="note-item__field">
    <a11y-label><span class="a11y-visually-hidden">Edit note</span></a11y-label>
    <textarea class="note-item__input" name="text" rows="4" required data-event="keydown:_onKeydown:@event">${note.text}</textarea>
  </a11y-textarea>
  <div class="note-item__actions">
    <button class="button button--primary" type="submit" tabindex="0">Save</button>
    <button class="button" type="button" tabindex="0" data-event="click:_cancel">Cancel</button>
    <span class="note-item__hint" aria-hidden="true">Ctrl+Enter to save · Esc to cancel</span>
  </div>
</form>` : html`
<p class="note-item__text" id="note-${note.id}-text">${note.text}</p>
<div class="note-item__footer">
  <span class="note-item__meta">${edited ? 'Edited ' : ''}<time datetime="${new Date(note.updatedAt).toISOString()}" title="${new Date(note.updatedAt).toLocaleString()}" data-pipe="timeAgo">${note.updatedAt}</time></span>
  <div class="note-item__actions">
    <button class="button button--small note-item__edit" type="button" tabindex="0" aria-describedby="note-${note.id}-text" data-event="click:_edit">Edit</button>
    <button class="button button--small note-item__move" type="button" tabindex="0" aria-describedby="note-${note.id}-text" data-event="click:_move">Move to ${moveTarget}</button>
    <button class="button button--small button--danger note-item__delete" type="button" tabindex="0" aria-describedby="note-${note.id}-text" data-event="click:_delete">Delete</button>
  </div>
</div>`}
