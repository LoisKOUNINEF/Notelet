name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck (build)
        run: npm run build -- -y

      - name: Unit tests
        run: npm run testin-nutin:only

  build:
    name: Build (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-extension
        with:
          browser: ${{ matrix.browser }}
          tag: ${{ inputs.tag }}

      - name: Source archive
        if: inputs.tag != '' && matrix.browser == 'firefox'
        env:
          TAG: ${{ inputs.tag }}
        run: git archive --format=zip --prefix="notelet-${TAG#v}/" -o "dist/notelet-source-${TAG#v}.zip" HEAD

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notelet-${{ matrix.browser }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: ${{ inputs.tag != '' && 30 || 7 }}
