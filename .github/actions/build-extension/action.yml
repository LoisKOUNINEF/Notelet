name: Build extension
description: >-
  Installs dependencies, packages the store ZIP for one browser, validates it (manifest, contents,
  versions), lints the Firefox build, and checks that a second build gives the same bytes.

inputs:
  browser:
    description: chrome or firefox
    required: true
  tag:
    description: Release tag (vX.Y.Z) the package's version must match. Empty outside releases.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Pin build timestamp
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

    - name: Package
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        NUTIN_ASSUME_YES: '1'
      run: npm run "package:extension:$BROWSER"

    - name: Validate
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        TAG: ${{ inputs.tag }}
      run: node tools/extension/validate-extension.js --browser "$BROWSER" ${TAG:+--tag "$TAG"}

    # Mozilla's addons-linter: errors fail, warnings are only reported.
    - name: Lint (addons-linter)
      if: inputs.browser == 'firefox'
      shell: bash
      run: npm run lint:extension

    - name: Check the build is reproducible
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        NUTIN_ASSUME_YES: '1'
      run: |
        cp dist/*-"$BROWSER"-*.zip.sha256 "$RUNNER_TEMP/first.sha256"
        rm -rf dist dist-build
        npm run "package:extension:$BROWSER" > /dev/null
        diff "$RUNNER_TEMP/first.sha256" dist/*-"$BROWSER"-*.zip.sha256
        cat dist/*-"$BROWSER"-*.zip.sha256
